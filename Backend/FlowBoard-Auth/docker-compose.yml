# FlowBoard – Auth Service + PostgreSQL
# Run with: docker-compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine        # Alpine = smaller footprint
    container_name: flowboard_auth_db
    environment:
      POSTGRES_DB:       flowboard_auth
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"                  # expose for local pgAdmin / DBeaver
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data   # persist data across restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowboard_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Auth Service ───────────────────────────────────────────────────────────
  flowboard-auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowboard_auth_service
    ports:
      - "5001:5001"
    environment:
      # Override appsettings.json values at runtime
      ASPNETCORE_ENVIRONMENT:  Development
      ASPNETCORE_URLS:         http://+:5001

      # Connection string uses the postgres service name as hostname
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=flowboard_auth;Username=postgres;Password=postgres"

      # JWT – override the default secret in production
      Jwt__Secret:    "FlowBoard-Super-Secret-Key-Must-Be-32-Chars!!"
      Jwt__Issuer:    "FlowBoard.Auth"
      Jwt__Audience:  "FlowBoard.Client"
      Jwt__ExpiryHours: "24"

      # CORS – allow the Angular frontend
      Cors__AllowedOrigins: "http://localhost:4200"

    depends_on:
      postgres:
        condition: service_healthy   # wait until Postgres passes its healthcheck
    restart: unless-stopped

volumes:
  postgres_auth_data:
    name: flowboard_auth_postgres_data
