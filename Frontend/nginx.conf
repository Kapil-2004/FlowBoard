server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Angular routing support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to microservices
    # Auth Service handles both /api/auth and /api/admin
    location /api/auth/ {
        proxy_pass http://auth-service:5001/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/admin/ {
        proxy_pass http://auth-service:5001/api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/workspaces/ {
        proxy_pass http://workspace-service:5002/api/workspaces/;
        proxy_set_header Host $host;
    }

    location /api/boards/ {
        proxy_pass http://board-service:5003/api/boards/;
        proxy_set_header Host $host;
    }

    location /api/lists/ {
        proxy_pass http://list-service:5004/api/lists/;
        proxy_set_header Host $host;
    }

    location /api/cards/ {
        proxy_pass http://card-service:5005/api/cards/;
        proxy_set_header Host $host;
    }

    location /api/comments/ {
        proxy_pass http://comment-service:5006/api/comments/;
        proxy_set_header Host $host;
    }

    location /api/attachments/ {
        proxy_pass http://comment-service:5006/api/attachments/;
        proxy_set_header Host $host;
    }

    location /api/labels/ {
        proxy_pass http://label-service:5007/api/label/;
        proxy_set_header Host $host;
    }

    location /api/checklist/ {
        proxy_pass http://label-service:5007/api/checklist/;
        proxy_set_header Host $host;
    }

    location /api/notifications/ {
        proxy_pass http://notification-service:5008/api/notifications/;
        proxy_set_header Host $host;
        
        # WebSockets for SignalR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
