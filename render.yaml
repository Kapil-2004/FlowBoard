databases:
  - name: flowboard-db
    databaseName: flowboard
    plan: free

services:
  # --- API Gateway (Central Hub) ---
  - type: web
    name: flowboard-gateway
    runtime: docker
    rootDir: ./Backend/FlowBoard-Gateway
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: ReverseProxy__Clusters__auth-cluster__Destinations__destination1__Address
        value: http://auth-service:10000
      - key: ReverseProxy__Clusters__workspace-cluster__Destinations__destination1__Address
        value: http://workspace-service:10000
      - key: ReverseProxy__Clusters__board-cluster__Destinations__destination1__Address
        value: http://board-service:10000
      - key: ReverseProxy__Clusters__list-cluster__Destinations__destination1__Address
        value: http://list-service:10000
      - key: ReverseProxy__Clusters__card-cluster__Destinations__destination1__Address
        value: http://card-service:10000
      - key: ReverseProxy__Clusters__comment-cluster__Destinations__destination1__Address
        value: http://comment-service:10000
      - key: ReverseProxy__Clusters__label-cluster__Destinations__destination1__Address
        value: http://label-service:10000
      - key: ReverseProxy__Clusters__notification-cluster__Destinations__destination1__Address
        value: http://notification-service:10000
      - key: Cors__AllowedOrigins
        value: https://flowboard-web.onrender.com

  # --- Backend Services ---
  - type: web
    name: auth-service
    runtime: docker
    rootDir: ./Backend/FlowBoard-Auth
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: Cors__AllowedOrigins
        value: https://flowboard-web.onrender.com
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: ConnectionStrings__DefaultConnectionAppend
        value: ";SearchPath=auth"
      - key: Jwt__Secret
        sync: false # Set this in Render Dashboard
      - key: Jwt__Issuer
        value: FlowBoard.Auth
      - key: Jwt__Audience
        value: FlowBoard.Client

  - type: web
    name: workspace-service
    runtime: docker
    rootDir: ./Backend/FlowBoard-Workspace
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: Cors__AllowedOrigins
        value: https://flowboard-web.onrender.com
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: ConnectionStrings__DefaultConnectionAppend
        value: ";SearchPath=workspace"
      - key: Jwt__Secret
        sync: false
      - key: Jwt__Issuer
        value: FlowBoard.Auth
      - key: Jwt__Audience
        value: FlowBoard.Client

  - type: web
    name: board-service
    runtime: docker
