databases:
  - name: flowboard-db
    databaseName: flowboard
    plan: free

services:
  # --- Backend Services ---
  - type: web
    name: auth-service
    runtime: docker
    rootDir: ./Backend/FlowBoard-Auth
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: Jwt__Secret
        sync: false
      - key: Jwt__Issuer
        value: FlowBoard.Auth
      - key: Jwt__Audience
        value: FlowBoard.Client

  - type: web
    name: workspace-service
    runtime: docker
    rootDir: ./Backend/FlowBoard-Workspace
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString

  - type: web
    name: board-service
    runtime: docker
    rootDir: ./Backend/FlowBoard-Board
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString

  - type: web
    name: list-service
    runtime: docker
    rootDir: ./Backend/FlowBoard-ListService
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString

  - type: web
    name: card-service
    runtime: docker
    rootDir: ./Backend/FlowBoard-CardService
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString

  - type: web
    name: comment-service
    runtime: docker
    rootDir: ./Backend/FlowBoard-Comment_AttachmentService
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: RabbitMQ__Uri
        sync: false

  - type: web
    name: label-service
    runtime: docker
    rootDir: ./Backend/FlowBoard-LabelService
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString

  - type: web
    name: notification-service
    runtime: docker
    rootDir: ./Backend/FlowBoard-NotificationService
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: RabbitMQ__Uri
        sync: false

  # --- Frontend Gateway ---
  - type: web
    name: flowboard-web
    runtime: docker
    rootDir: ./Frontend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: auth-service
          property: host
      - key: WORKSPACE_SERVICE_URL
        fromService:
          type: web
          name: workspace-service
          property: host
      - key: BOARD_SERVICE_URL
        fromService:
          type: web
          name: board-service
          property: host
      - key: LIST_SERVICE_URL
        fromService:
          type: web
          name: list-service
          property: host
      - key: CARD_SERVICE_URL
        fromService:
          type: web
          name: card-service
          property: host
      - key: COMMENT_SERVICE_URL
        fromService:
          type: web
          name: comment-service
          property: host
      - key: LABEL_SERVICE_URL
        fromService:
          type: web
          name: label-service
          property: host
      - key: NOTIFICATION_SERVICE_URL
        fromService:
          type: web
          name: notification-service
          property: host
