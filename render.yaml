databases:
  - name: flowboard-db
    databaseName: flowboard
    plan: free

services:
  # --- API Gateway (Central Hub) ---
  - type: web
    name: flowboard-gateway
    runtime: docker
    rootDir: ./Backend/FlowBoard-Gateway
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ReverseProxy__Clusters__auth-cluster__Destinations__destination1__Address
        value: https://auth-service-2izy.onrender.com
      - key: ReverseProxy__Clusters__workspace-cluster__Destinations__destination1__Address
        value: https://workspace-service-hnf7.onrender.com
      - key: ReverseProxy__Clusters__board-cluster__Destinations__destination1__Address
        value: https://board-service-9fpw.onrender.com
      - key: ReverseProxy__Clusters__list-cluster__Destinations__destination1__Address
        value: https://list-service-e5uu.onrender.com
      - key: ReverseProxy__Clusters__card-cluster__Destinations__destination1__Address
        value: https://card-service-svau.onrender.com
      - key: ReverseProxy__Clusters__comment-cluster__Destinations__destination1__Address
        value: https://comment-service-4xaq.onrender.com
      - key: ReverseProxy__Clusters__label-cluster__Destinations__destination1__Address
        value: https://label-service-de13.onrender.com
      - key: ReverseProxy__Clusters__notification-cluster__Destinations__destination1__Address
        value: https://notification-service-7mxn.onrender.com
      - key: Cors__AllowedOrigins
        value: https://flowboard-web.onrender.com

  # --- Backend Services ---
  - type: web
    name: auth-service
    runtime: docker
    rootDir: ./Backend/FlowBoard-Auth
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: ConnectionStrings__DefaultConnectionAppend
        value: ";SearchPath=auth"
      - key: Jwt__Secret
        sync: false # Set this in Render Dashboard
      - key: Jwt__Issuer
        value: FlowBoard.Auth
      - key: Jwt__Audience
        value: FlowBoard.Client

  - type: web
    name: workspace-service
    runtime: docker
    rootDir: ./Backend/FlowBoard-Workspace
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: ConnectionStrings__DefaultConnectionAppend
        value: ";SearchPath=workspace"

  - type: web
    name: board-service
    runtime: docker
    rootDir: ./Backend/FlowBoard-Board
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: ConnectionStrings__DefaultConnectionAppend
        value: ";SearchPath=board"

  - type: web
    name: list-service
    runtime: docker
    rootDir: ./Backend/FlowBoard-ListService
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: ConnectionStrings__DefaultConnectionAppend
        value: ";SearchPath=list"

  - type: web
    name: card-service
    runtime: docker
    rootDir: ./Backend/FlowBoard-CardService
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: ConnectionStrings__DefaultConnectionAppend
        value: ";SearchPath=card"

  - type: web
    name: comment-service
    runtime: docker
    rootDir: ./Backend/FlowBoard-Comment_AttachmentService
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: ConnectionStrings__DefaultConnectionAppend
        value: ";SearchPath=comment"

  - type: web
    name: label-service
    runtime: docker
    rootDir: ./Backend/FlowBoard-LabelService
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: ConnectionStrings__DefaultConnectionAppend
        value: ";SearchPath=label"

  - type: web
    name: notification-service
    runtime: docker
    rootDir: ./Backend/FlowBoard-NotificationService
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: ConnectionStrings__DefaultConnectionAppend
        value: ";SearchPath=notification"

  # --- Frontend ---
  - type: web
    name: flowboard-web
    runtime: docker
    rootDir: ./Frontend
    plan: free
    envVars:
      - key: API_GATEWAY_URL
        value: https://flowboard-gateway-9p8e.onrender.com
