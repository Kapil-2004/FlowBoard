databases:
  - name: flowboard-db
    databaseName: flowboard
    plan: free

services:
  # --- Backend Services ---
  - type: web
    name: auth-service
    runtime: docker
    rootDir: ./Backend/FlowBoard-Auth
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: Jwt__Secret
        sync: false
      - key: Jwt__Issuer
        value: FlowBoard.Auth
      - key: Jwt__Audience
        value: FlowBoard.Client
      - key: Cors__AllowedOrigins
        value: https://flowboard-web.onrender.com

  - type: web
    name: workspace-service
    runtime: docker
    rootDir: ./Backend/FlowBoard-Workspace
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: Cors__AllowedOrigins
        value: https://flowboard-web.onrender.com

  - type: web
    name: board-service
    runtime: docker
    rootDir: ./Backend/FlowBoard-Board
