databases:
  - name: flowboard-db
    databaseName: flowboard
    user: postgres
    plan: free

services:
  # --- Message Broker ---
  - type: pserv
    name: rabbitmq
    env: docker
    dockerfile: Dockerfile.rabbitmq
    plan: starter

  # --- Backend Services ---
  - type: web
    name: auth-service
    env: docker
    dockerContextDir: ./Backend/FlowBoard-Auth
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:5001
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: Jwt__Secret
        sync: false
      - key: Jwt__Issuer
        value: FlowBoard.Auth
      - key: Jwt__Audience
        value: FlowBoard.Client

  - type: web
    name: workspace-service
    env: docker
    dockerContextDir: ./Backend/FlowBoard-Workspace
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:5002
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString

  - type: web
    name: board-service
    env: docker
    dockerContextDir: ./Backend/FlowBoard-Board
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:5003
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString

  - type: web
    name: list-service
    env: docker
    dockerContextDir: ./Backend/FlowBoard-ListService
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:5004
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString

  - type: web
    name: card-service
    env: docker
    dockerContextDir: ./Backend/FlowBoard-CardService
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:5005
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString

  - type: web
    name: comment-service
    env: docker
    dockerContextDir: ./Backend/FlowBoard-Comment_AttachmentService
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:5006
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: RabbitMQ__Host
        value: rabbitmq

  - type: web
    name: label-service
    env: docker
    dockerContextDir: ./Backend/FlowBoard-LabelService
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:5007
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString

  - type: web
    name: notification-service
    env: docker
    dockerContextDir: ./Backend/FlowBoard-NotificationService
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:5008
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: RabbitMQ__Host
        value: rabbitmq

  # --- Frontend Gateway ---
  - type: web
    name: flowboard-web
    env: docker
    dockerContextDir: ./Frontend
    dockerfilePath: Dockerfile
    plan: free
    domains:
      - flowboard.onrender.com # Change to your actual domain
