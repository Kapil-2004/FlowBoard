# FlowBoard – Full Stack Orchestration
# Run with: docker-compose up --build

services:

  # --- Databases ---
  postgres:
    image: postgres:16-alpine
    container_name: flowboard_db
    environment:
      POSTGRES_DB: flowboard_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowboard_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_workspace:
    image: postgres:16-alpine
    container_name: flowboard_workspace_db
    environment:
      POSTGRES_DB: flowboard_workspace_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_workspace_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowboard_workspace_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_board:
    image: postgres:16-alpine
    container_name: flowboard_board_db
    environment:
      POSTGRES_DB: flowboard_board_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_board_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowboard_board_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_list:
    image: postgres:16-alpine
    container_name: flowboard_list_db
    environment:
      POSTGRES_DB: flowboard_list_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_list_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowboard_list_db"]
      interval: 10s
      timeout: 5s
      retries: 5


  # --- Backend (Auth Service) ---
  auth-service:
    build:
      context: ./Backend/FlowBoard-Auth
      dockerfile: Dockerfile
    container_name: flowboard_backend
    ports:
      - "5001:5001"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=flowboard_auth;Username=postgres;Password=postgres"
      Jwt__Secret: "FlowBoard-Super-Secret-Key-Must-Be-32-Chars!!"
      Jwt__Issuer: "FlowBoard.Auth"
      Jwt__Audience: "FlowBoard.Client"
      Jwt__ExpiryHours: "24"
      Cors__AllowedOrigins: "http://localhost:4200"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --- Backend (Workspace Service) ---
  workspace-service:
    build:
      context: ./Backend/FlowBoard-Workspace
      dockerfile: Dockerfile
    container_name: flowboard_workspace_service
    ports:
      - "5002:5002"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5002
      ConnectionStrings__DefaultConnection: "Host=postgres_workspace;Port=5432;Database=flowboard_workspace_db;Username=postgres;Password=postgres"
      Jwt__Secret: "FlowBoard-Super-Secret-Key-Must-Be-32-Chars!!"
      Jwt__Issuer: "FlowBoard.Auth"
      Jwt__Audience: "FlowBoard.Client"
      Cors__AllowedOrigins: "http://localhost:4200"
    depends_on:
      postgres_workspace:
        condition: service_healthy
    restart: unless-stopped

  # --- Backend (Board Service) ---
  board-service:
    build:
      context: ./Backend/FlowBoard-Board
      dockerfile: Dockerfile
    container_name: flowboard_board_service
    ports:
      - "5003:5003"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5003
      ConnectionStrings__DefaultConnection: "Host=postgres_board;Port=5432;Database=flowboard_board_db;Username=postgres;Password=postgres"
      Jwt__Secret: "FlowBoard-Super-Secret-Key-Must-Be-32-Chars!!"
      Jwt__Issuer: "FlowBoard.Auth"
      Jwt__Audience: "FlowBoard.Client"
      Cors__AllowedOrigins: "http://localhost:4200"
    depends_on:
      postgres_board:
        condition: service_healthy
    restart: unless-stopped

  # --- Backend (List Service) ---
  list-service:
    build:
      context: ./Backend/FlowBoard-ListService
      dockerfile: Dockerfile
    container_name: flowboard_list_service
    ports:
      - "5004:5004"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5004
      ConnectionStrings__DefaultConnection: "Host=postgres_list;Port=5432;Database=flowboard_list_db;Username=postgres;Password=postgres"
      Jwt__Secret: "FlowBoard-Super-Secret-Key-Must-Be-32-Chars!!"
      Jwt__Issuer: "FlowBoard.Auth"
      Jwt__Audience: "FlowBoard.Client"
      Cors__AllowedOrigins: "http://localhost:4200"
    depends_on:
      postgres_list:
        condition: service_healthy
    restart: unless-stopped

  # --- Frontend (Web Client) ---
  web-client:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: flowboard_frontend
    ports:
      - "4200:80"
    depends_on:
      - auth-service
      - workspace-service
      - board-service
      - list-service
    restart: unless-stopped

volumes:
  postgres_data:
    name: flowboard_postgres_data
  postgres_workspace_data:
    name: flowboard_postgres_workspace_data
  postgres_board_data:
    name: flowboard_postgres_board_data
  postgres_list_data:
    name: flowboard_postgres_list_data
